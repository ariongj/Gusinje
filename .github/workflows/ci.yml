# Type-checks, lints, builds and tests every push and pull request.
# Nothing is published from here.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Pinned: the Playwright version in package.json installs its browser on
    # Ubuntu 24.04, not yet on the release "ubuntu-latest" now points to.
    # Move this forward together with @playwright/test.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npx playwright test
