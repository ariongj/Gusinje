# Publishes a static preview of the site to GitHub Pages on every push to main:
# https://<owner>.github.io/<repo>/
#
# Pages only serves files, so the preview is a static export without the API
# route: the request form offers to send each request by email instead (or
# posts to NEXT_PUBLIC_ENQUIRY_ENDPOINT if that repository variable is set).
# For production with the server API, deploy the repository to Vercel.

name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build static export
        run: |
          rm -rf src/app/api   # server-only routes; not available on static hosting
          npm run build
          touch out/.nojekyll
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_STATIC_EXPORT: "true"
          NEXT_PUBLIC_NOINDEX: "true"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          NEXT_PUBLIC_ENQUIRY_ENDPOINT: ${{ vars.NEXT_PUBLIC_ENQUIRY_ENDPOINT }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
