# Builds the static site and (only when started by hand) publishes it to
# GitHub Pages: https://<owner>.github.io/<repo>/
#
# Deliberately NOT triggered by pushes: publishing is a decision, not a side
# effect. Start it from Actions → "Deploy preview to GitHub Pages" → Run
# workflow, once the content and approvals in docs/LAUNCH.md are in place.
# The preview is marked noindex so search engines skip it.

name: Deploy preview to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static export
        run: |
          npm run build
          touch out/.nojekyll
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_NOINDEX: "true"
          # The preview shows a full guide with labelled demo listings (src/content/demo.ts).
          NEXT_PUBLIC_DEMO: "true"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
