<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0f3b3f" />
    <title>Offline · Valley Guide</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        background: #f2efe9;
        color: #152a2c;
        font: 400 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 48px 20px;
      }
      h1 {
        margin: 0 0 8px;
        font: 600 30px/1.2 Georgia, "Times New Roman", serif;
      }
      p {
        margin: 0 0 16px;
        color: #34494b;
      }
      button {
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 999px;
        background: #0f3b3f;
        color: #fff;
        font: 700 15px/1 inherit;
        cursor: pointer;
      }
      ul {
        margin: 0 0 24px;
        padding: 0;
        list-style: none;
      }
      li a {
        display: flex;
        align-items: center;
        min-height: 44px;
        padding: 6px 0;
        border-bottom: 1px solid #cdd6d4;
        color: #0f3b3f;
        font-weight: 600;
        text-decoration: none;
      }
      li a:hover,
      li a:focus-visible {
        text-decoration: underline;
      }
      .note {
        padding: 12px 14px;
        border-radius: 12px;
        background: #fff;
        border: 1px solid #cdd6d4;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 data-text="title">You're offline</h1>
      <p data-text="intro">This page hasn't been saved on this device yet. Pages you've opened before still work without signal:</p>
      <ul id="saved"></ul>
      <p id="none" data-text="none" hidden>No saved pages yet.</p>
      <p><button type="button" id="retry" data-text="retry">Try again</button></p>
      <p class="note" data-text="emergency">Emergency number in Montenegro: 112</p>
    </main>
    <script>
      (function () {
        var text = {
          sq: {
            title: "Jeni jashtë linje",
            intro: "Kjo faqe nuk është ruajtur ende në këtë pajisje. Faqet që keni hapur më parë punojnë edhe pa sinjal:",
            none: "Ende nuk ka faqe të ruajtura.",
            retry: "Provo përsëri",
            emergency: "Numri i emergjencës në Mal të Zi: 112",
          },
          cnr: {
            title: "Niste na mreži",
            intro: "Ova stranica još nije sačuvana na ovom uređaju. Stranice koje ste ranije otvorili rade i bez signala:",
            none: "Još nema sačuvanih stranica.",
            retry: "Pokušaj ponovo",
            emergency: "Broj za hitne slučajeve u Crnoj Gori: 112",
          },
        };
        var match = location.pathname.match(/\/(en|sq|cnr)\//);
        var lang = match ? match[1] : "en";
        document.documentElement.lang = lang;
        if (text[lang]) {
          document.querySelectorAll("[data-text]").forEach(function (el) {
            el.textContent = text[lang][el.getAttribute("data-text")];
          });
          document.title = text[lang].title;
        }
        document.getElementById("retry").addEventListener("click", function () {
          location.reload();
        });

        // List the pages saved on this device, in this language first.
        var list = document.getElementById("saved");
        var none = document.getElementById("none");
        if (!("caches" in window)) {
          none.hidden = false;
          return;
        }
        caches
          .open("valley-guide-v1")
          .then(function (cache) {
            return cache.keys().then(function (requests) {
              var pages = requests
                .map(function (r) {
                  return r.url;
                })
                .filter(function (url) {
                  return /\/(en|sq|cnr)\/(.*\/)?$/.test(url);
                })
                .sort(function (a, b) {
                  var inLangA = a.indexOf("/" + lang + "/") > -1 ? 0 : 1;
                  var inLangB = b.indexOf("/" + lang + "/") > -1 ? 0 : 1;
                  return inLangA - inLangB || a.localeCompare(b);
                })
                .slice(0, 60);
              return Promise.all(
                pages.map(function (url) {
                  return cache
                    .match(url, { ignoreVary: true })
                    .then(function (res) {
                      return res ? res.text() : "";
                    })
                    .then(function (html) {
                      var title = html.match(/<title>([^<]*)<\/title>/);
                      var div = document.createElement("div");
                      div.innerHTML = title ? title[1] : "";
                      // "Travel Tips · Valley Guide name" → "Travel Tips"
                      var name = (div.textContent || "").split(" · ")[0];
                      return { url: url, title: name || new URL(url).pathname };
                    });
                }),
              );
            });
          })
          .then(function (pages) {
            if (!pages.length) none.hidden = false;
            pages.forEach(function (page) {
              var li = document.createElement("li");
              var a = document.createElement("a");
              a.href = page.url;
              a.textContent = page.title;
              li.appendChild(a);
              list.appendChild(li);
            });
          })
          .catch(function () {
            none.hidden = false;
          });
      })();
    </script>
  </body>
</html>
